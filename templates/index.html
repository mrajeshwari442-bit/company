<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ company_name }} · Study Assistant</title>
<style>
  :root {
    --ink: #12213a;
    --ink-soft: #4a5a76;
    --paper: #f4f2ec;
    --panel: #ffffff;
    --line: #dfdbcf;
    --accent: #b5551f;
    --accent-soft: #f1e1d3;
    --user-bubble: #12213a;
    --user-text: #f4f2ec;
    --bot-bubble: #ffffff;
    --bot-text: #1c273a;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 64px);
    min-height: 480px;
  }

  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }

  .kicker {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin: 0 0 6px 0;
  }

  h1 {
    font-size: 26px;
    margin: 0;
    line-height: 1.25;
  }

  .subtitle {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  #chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 8px 4px 16px 4px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .row {
    display: flex;
  }

  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-top-right-radius: 0;
  }

  .row.bot .bubble {
    background: var(--bot-bubble);
    color: var(--bot-text);
    border: 1px solid var(--line);
    border-top-left-radius: 0;
  }

  .bubble.typing {
    color: var(--ink-soft);
    font-style: italic;
  }

  form#chat-form {
    display: flex;
    gap: 10px;
    border-top: 2px solid var(--ink);
    padding-top: 14px;
  }

  #message-input {
    flex: 1;
    resize: none;
    height: 48px;
    padding: 12px 14px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--ink);
  }

  #message-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  button#send-btn {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 0.03em;
    padding: 0 22px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
  }

  button#send-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  button#send-btn:hover:not(:disabled) {
    background: var(--accent);
  }

  .scope-note {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 10px;
    text-align: center;
  }

  #chat-window::-webkit-scrollbar { width: 8px; }
  #chat-window::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

  <div class="app">
    <header>
      <p class="kicker">STUDY ASSISTANT</p>
      <h1>{{ company_name }}</h1>
      <p class="subtitle">Ask about {{ company_name }}'s study material — anything else is out of scope.</p>
    </header>

    <div id="chat-window"></div>

    <form id="chat-form">
      <textarea id="message-input" placeholder="Type your question..." required></textarea>
      <button id="send-btn" type="submit">Ask</button>
    </form>

    <p class="scope-note">This assistant only answers questions related to {{ company_name }}.</p>
  </div>

<script>
  const chatWindow = document.getElementById("chat-window");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");

  const history = [];

  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "bot");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(bubble);
    chatWindow.appendChild(row);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
  }

  async function sendMessage(message) {
    addBubble("user", message);
    history.push({ role: "user", text: message });

    const typingBubble = addBubble("bot", "Thinking...");
    typingBubble.classList.add("typing");

    sendBtn.disabled = true;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history: history.slice(0, -1) })
      });

      const data = await res.json();
      const reply = data.reply || data.error || "Something went wrong. Please try again.";

      typingBubble.textContent = reply;
      typingBubble.classList.remove("typing");
      history.push({ role: "assistant", text: reply });
    } catch (err) {
      typingBubble.textContent = "Could not reach the server. Please try again.";
      typingBubble.classList.remove("typing");
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    sendMessage(message);
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
</script>

</body>
</html>
